# Pandoc defaults for: Slides (16:9 pages). Paths are relative to .pandoc/ (the builder runs pandoc from there).
from: markdown+lists_without_preceding_blankline-implicit_figures+task_lists
pdf-engine: lualatex
template: templates/slides.latex
filters:
  - filters/cybertechna.lua
  - filters/cybertechna-slides.lua
  - filters/cybertechna-tables.lua
syntax-highlighting: none
metadata:
  doc-type: "Slides"
  landscape: none
