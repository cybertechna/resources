# Pandoc defaults for: White Paper. Paths are relative to .pandoc/ (the builder runs pandoc from there).
from: markdown+lists_without_preceding_blankline-implicit_figures+task_lists
pdf-engine: lualatex
template: templates/whitepaper.latex
filters:
  - filters/cybertechna.lua
  - filters/cybertechna-tables.lua
syntax-highlighting: none
metadata:
  doc-type: "White Paper"

  classification: "Public"
